# Run a skill — any AI step on this restaurant, as a job on its own AI key.
#
# The Bread 'n' Butter app starts it with a GitHub `repository_dispatch`,
# event `run-skill`, `client_payload: { skill, payload }` (the app's
# src/lib/repo-dispatch.ts). It installs Claude Code, connects it to this
# restaurant's MCP — the `restaurant` server in .mcp.json, with the scoped
# `bnb_…` token as bearer — and runs `claude -p` with the named skill and the
# payload. invoice-intake is the first skill it runs:
#
#   { "skill": "invoice-intake", "payload": { "file_url": "<signed link>",
#     "file_path": "<slug>/invoices/…", "reading_id": "<invoice_readings.id>" } }
#
# reading_id is the hand-off row the app wrote when the owner dropped the
# file; this job closes it through the MCP when the run ends (status read ·
# duplicate · failed, invoice_id, summary, run_url, finished_at), even when
# the run dies half way. A payload of `{ "invoice_id": … }` is a resume: the
# owner answered a parked decision, and the skill applies every answered
# `decisions` row of that invoice.
#
# Which restaurant: the RESTAURANT_SLUG repo variable when set, else `slug` in
# .lyte/field.json (the hand-off writes it); the app address is the
# BNB_APP_URL repo variable, else `app_url` in .lyte/field.json. Nothing here
# names a restaurant: a repo not handed off yet stops at "Resolve the
# restaurant" and says why.
#
# Headless means every human gate in the skill is park-and-notify: the pending
# decision lands as a `decisions` row the owner answers in the app, and that
# line stops. The Actions tab's Run workflow button is the hand path.
#
# Secrets this job reads (Settings → Secrets and variables → Actions):
#   ANTHROPIC_API_KEY      the restaurant's own AI key
#   BNB_RESTAURANT_TOKEN   the restaurant's Read + write `bnb_…` token
#                          (Bread 'n' Butter → Settings → Connect your AI)
# Neither is printed: the token reaches Claude Code through .mcp.json's
# ${BNB_RESTAURANT_TOKEN} expansion and the close-out's own header, and the
# log holds statuses and titles only.

name: Run a skill

on:
  workflow_dispatch:
    inputs:
      skill:
        description: The skill to run (a folder under workers/skills/)
        type: string
        required: true
        default: invoice-intake
      payload:
        description: 'JSON payload for the skill, e.g. {"invoice_id":"…"} to finish an invoice whose decisions were answered'
        type: string
        required: true
        default: '{}'
  repository_dispatch:
    types: [run-skill]

permissions:
  contents: read

concurrency:
  group: agent-job
  cancel-in-progress: false

jobs:
  skill:
    name: run the named skill headlessly
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Resolve skill and payload
        id: params
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUTS_JSON: ${{ toJSON(github.event.inputs) }}
          CLIENT_PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
        run: |
          # workflow_dispatch → the form; repository_dispatch → client_payload { skill, payload }.
          # The skill must be a folder under workers/skills/ — anything else stops here.
          node -e '
            const fs = require("fs");
            const ev = process.env.EVENT_NAME;
            const inputs = JSON.parse(process.env.INPUTS_JSON || "null") || {};
            const cp = JSON.parse(process.env.CLIENT_PAYLOAD_JSON || "null") || {};
            let skill, payload;
            if (ev === "workflow_dispatch") {
              skill = String(inputs.skill || "").trim();
              try { payload = JSON.parse(inputs.payload || "{}"); } catch (e) { console.error("::error::payload input is not JSON"); process.exit(1); }
            } else {
              skill = String(cp.skill || "").trim();
              payload = cp.payload;
            }
            if (!/^[a-z0-9-]+$/.test(skill) || !fs.existsSync(`workers/skills/${skill}/SKILL.md`)) {
              console.error(`::error::unknown skill "${skill}" — it must be a folder under workers/skills/ with a SKILL.md`); process.exit(1);
            }
            if (!payload || typeof payload !== "object" || Array.isArray(payload)) payload = {};
            const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
            const str = (v) => (typeof v === "string" ? v : "");
            const fileUrl = /^https:\/\//.test(str(payload.file_url)) ? payload.file_url : "";
            const readingId = uuid.test(str(payload.reading_id)) ? payload.reading_id : "";
            // The stored file name: the payload path (the app prefixes an 8-hex upload id), else the link.
            let fileName = (str(payload.file_path) || fileUrl.split("?")[0]).split("/").pop().replace(/^[0-9a-f]{8}-/, "");
            fileName = fileName.replace(/[^A-Za-z0-9._-]/g, "_").slice(0, 120) || "input.bin";
            // The signed link is a credential for one file: kept out of the outputs, the log,
            // the prompt and the uploaded artifact — only the fetch step reads it.
            fs.mkdirSync("job", { recursive: true });
            if (fileUrl) fs.writeFileSync("job/file-url", fileUrl);
            const { file_url, ...shown } = payload;
            fs.writeFileSync("job/payload.json", JSON.stringify(shown, null, 2) + "\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `skill=${skill}\nreading_id=${readingId}\nfile_name=${fileName}\nhas_file=${fileUrl ? "true" : ""}\n`);
            console.log("skill:", skill, "· payload keys:", Object.keys(payload).join(", ") || "(none)", "· hand-off row:", readingId || "none");
          '

      - name: Resolve the restaurant (repo variables, else .lyte/field.json)
        id: restaurant
        env:
          VAR_SLUG: ${{ vars.RESTAURANT_SLUG }}
          VAR_APP_URL: ${{ vars.BNB_APP_URL }}
        run: |
          node -e '
            const fs = require("fs");
            let j = {}; try { j = JSON.parse(fs.readFileSync(".lyte/field.json", "utf8")) || {}; } catch (e) {}
            const slug = String(process.env.VAR_SLUG || j.slug || "").trim();
            const app = String(process.env.VAR_APP_URL || j.app_url || "https://bread-n-butter.tech").trim().replace(/\/$/, "");
            if (!/^[a-z0-9][a-z0-9-]*$/.test(slug)) { console.error("::error::No restaurant slug — set the RESTAURANT_SLUG repo variable or `slug` in .lyte/field.json (the hand-off writes it). Nothing was run."); process.exit(1); }
            if (!/^https:\/\//.test(app)) { console.error("::error::The app address is not https — fix the BNB_APP_URL repo variable or `app_url` in .lyte/field.json."); process.exit(1); }
            const out = { slug, app_url: app, mcp_url: `${app}/api/restaurants/${slug}/mcp` };
            for (const [k, v] of Object.entries(out)) fs.appendFileSync(process.env.GITHUB_OUTPUT, `${k}=${v}\n`);
            console.log("restaurant:", slug, "· MCP:", out.mcp_url);
          '

      - name: Check the secrets exist
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_TOKEN: ${{ secrets.BNB_RESTAURANT_TOKEN != '' }}
        run: |
          ok=1
          [ "$HAS_KEY" = "true" ]   || { echo "::error::The ANTHROPIC_API_KEY repo secret is not set — the skill cannot run without a model. Add it under Settings → Secrets and variables → Actions."; ok=0; }
          [ "$HAS_TOKEN" = "true" ] || { echo "::error::The BNB_RESTAURANT_TOKEN repo secret is not set — mint a Read + write token in Bread 'n' Butter (Settings → Connect your AI) and add it under Settings → Secrets and variables → Actions."; ok=0; }
          [ "$ok" = 1 ]

      - name: Open the door (the restaurant MCP answers this token)
        env:
          MCP_URL: ${{ steps.restaurant.outputs.mcp_url }}
          BNB_RESTAURANT_TOKEN: ${{ secrets.BNB_RESTAURANT_TOKEN }}
        run: |
          node -e '
            (async () => {
              const res = await fetch(process.env.MCP_URL, {
                method: "POST",
                headers: { "content-type": "application/json", accept: "application/json, text/event-stream",
                  authorization: `Bearer ${process.env.BNB_RESTAURANT_TOKEN}` },
                body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "tools/call", params: { name: "list_tables", arguments: {} } }),
                signal: AbortSignal.timeout(30000),
              }).catch((e) => ({ ok: false, status: 0, text: async () => String(e && e.message) }));
              const body = await res.text();
              let reply = null; try { reply = JSON.parse(body); } catch (e) {}
              const tables = reply && reply.result && reply.result.structuredContent && reply.result.structuredContent.tables;
              if (!res.ok || !Array.isArray(tables)) {
                const why = reply && reply.error ? reply.error.message : reply && reply.result && reply.result.isError ? reply.result.content[0].text : `HTTP ${res.status}`;
                console.error(`::error::The restaurant MCP refused list_tables (${why}). A 401/403 is a missing, revoked or read-only BNB_RESTAURANT_TOKEN; a 404 is a wrong slug or app address.`);
                process.exit(1);
              }
              console.log("restaurant MCP:", tables.length, "tables and views");
            })();
          '

      - name: Install Claude Code and a PDF text extractor
        run: |
          npm install -g @anthropic-ai/claude-code
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
          claude --version
          pdftotext -v 2>&1 | head -1

      - name: Fetch the input file
        id: input
        if: steps.params.outputs.has_file == 'true'
        env:
          FILE_NAME: ${{ steps.params.outputs.file_name }}
        run: |
          set -uo pipefail
          mkdir -p job/input
          # A signed, short-lived link to the app's own storage: no header needed, never printed.
          code="$(curl -sS -L --max-time 120 -o "job/input/$FILE_NAME" -w '%{http_code}' "$(cat job/file-url)")"
          rm -f job/file-url
          if [ "$code" != "200" ]; then echo "::error::could not fetch the input file (HTTP $code) — the link may have expired; drop the invoice again"; exit 1; fi
          case "$FILE_NAME" in
            *.pdf|*.PDF) pdftotext -layout "job/input/$FILE_NAME" "job/input/$FILE_NAME.txt" && echo "extracted $(wc -l < "job/input/$FILE_NAME.txt") lines of text" ;;
          esac
          ls -la job/input

      - name: Wire the write checker
        run: |
          # The skill's write checker re-does the per-row arithmetic on every row the restaurant MCP stores.
          cat > job/settings.json <<'EOF'
          {
            "hooks": {
              "PostToolUse": [
                { "matcher": "mcp__restaurant__(create_row|update_row|upsert_row|write_rows)",
                  "hooks": [ { "type": "command", "command": "node \"${CLAUDE_PROJECT_DIR:-.}/workers/skills/invoice-intake/hooks/check-write.cjs\"" } ] }
              ]
            }
          }
          EOF

      - name: Compose the prompt
        env:
          SKILL: ${{ steps.params.outputs.skill }}
          FILE_NAME: ${{ steps.params.outputs.file_name }}
          HAS_FILE: ${{ steps.input.outcome == 'success' }}
          SLUG: ${{ steps.restaurant.outputs.slug }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          payload="$(cat job/payload.json)"
          input_block=""
          if [ "$HAS_FILE" = "true" ]; then
            input_block="## Input file
          The file from the payload is already downloaded: \`job/input/$FILE_NAME\`. (Its signed link is withheld from this prompt; you do not need it.)"
            if [ -f "job/input/$FILE_NAME.txt" ]; then input_block="$input_block
          Its text, extracted with layout kept (\`pdftotext -layout\`), is at \`job/input/$FILE_NAME.txt\` — read that first; a plain PDF read of a vendor email returns nothing."; fi
          fi
          cat > job/prompt.md <<EOF
          /$SKILL

          You are running HEADLESS, as GitHub Actions run $RUN_URL for the restaurant \`$SLUG\`. No person is present in this session. Work the /$SKILL skill end to end on the payload below, exactly as its SKILL.md says for a headless run. The restaurant's data is reached ONLY through the \`restaurant\` MCP server (list_tables · list_rows · get_row · create_row · update_row · upsert_row · delete_row · write_rows · upload_invoice_file · recipe_cost); there is no other way in.

          ## Payload
          \`\`\`json
          $payload
          \`\`\`

          $input_block

          ## Rules for this run
          - **Nobody can answer you.** Every human gate the skill names is park-and-notify: write the pending decision as a \`decisions\` row (\`create_row\`: \`kind\`, the \`invoice_id\` / \`invoice_line_id\` / \`recipe_id\` it belongs to, \`title\` saying what is needed in the owner's words, \`notes\` saying what you propose, what it blocks and what clears it, \`status\` "open") and stop that line. Never guess a conversion, an each weight, a category or a new ingredient.
          - **A payload with \`invoice_id\` is a resume:** the invoice is already in. Read no file, create no invoice or line; apply each \`decisions\` row of it with \`status\` "answered" as the skill says, and mark each one "done".
          - **Refuse duplicates on a first reading** (skill step 2b): an invoice from the same vendor with the same invoice number that already has lines → write nothing, finish with status "duplicate".
          - **Never write \`invoice_readings\`.** This job closes the hand-off itself from your outcome.
          - **A hook re-checks each stored row** after every create_row / update_row / upsert_row, and each write of a write_rows batch by its index; fix anything it blocks before moving on.
          - **Write two files before you finish**, in this checkout:
            - \`job/report.md\` — the skill's full report (its Verification table first, then everything the skill's Report step asks for, then the decisions you parked, by title). Plain kitchen words: recipe, ingredient, invoice, vendor item, dish.
            - \`job/outcome.json\` — one JSON object: \`{"status":"read"|"duplicate"|"done"|"failed","invoice_id":"<invoices.id or null>","parked":["<decision title>",…],"summary":"<one line for the owner>"}\`. "read" is an invoice read and written (a resume that finished its answers is "read" too); "done" is any other skill finished; "failed" only when the skill could not finish (a total that will not close, an unreadable file) — say why in summary.
          - End your final message with that same one-line summary.
          EOF
          echo "prompt: $(wc -c < job/prompt.md) bytes"

      - name: Run the skill (claude -p on the restaurant MCP)
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BNB_RESTAURANT_TOKEN: ${{ secrets.BNB_RESTAURANT_TOKEN }}
          RESTAURANT_SLUG: ${{ steps.restaurant.outputs.slug }}
          BNB_APP_URL: ${{ steps.restaurant.outputs.app_url }}
          # The repo's own lane-report hook stays inert in this job.
          LANE_REPORT: 'off'
        run: |
          set -uo pipefail
          claude -p "$(cat job/prompt.md)" \
            --mcp-config .mcp.json --strict-mcp-config \
            --settings job/settings.json \
            --dangerously-skip-permissions \
            --max-turns 250 \
            --output-format json \
            > job/claude-output.json || echo "::warning::claude exited non-zero — reading what it left behind"
          node -e '
            const fs = require("fs");
            let out = null; try { out = JSON.parse(fs.readFileSync("job/claude-output.json", "utf8")); } catch (e) {}
            const result = out && typeof out.result === "string" ? out.result : "";
            if (result) fs.writeFileSync("job/result.md", result + "\n");
            if (out) { const { num_turns, duration_ms, total_cost_usd, is_error } = out; console.log("turns:", num_turns, "duration_ms:", duration_ms, "cost_usd:", total_cost_usd, "is_error:", is_error); }
            let outcome = {};
            try { outcome = JSON.parse(fs.readFileSync("job/outcome.json", "utf8")); } catch (e) { outcome = { status: "failed", summary: "The reading stopped before it finished." }; }
            const status = ["read", "duplicate", "done", "failed"].includes(outcome.status) ? outcome.status : "failed";
            const o = process.env.GITHUB_OUTPUT;
            fs.appendFileSync(o, `status=${status}\n`);
            fs.appendFileSync(o, `invoice_id=${/^[0-9a-f-]{36}$/i.test(String(outcome.invoice_id || "")) ? outcome.invoice_id : ""}\n`);
            fs.appendFileSync(o, `summary=${String(outcome.summary || "").replace(/[\r\n]/g, " ").slice(0, 500)}\n`);
            console.log("outcome:", status, "—", outcome.summary || "");
          '

      - name: Close the hand-off (invoice_readings, through the restaurant MCP)
        if: always() && steps.params.outputs.reading_id != '' && steps.restaurant.outputs.mcp_url != ''
        env:
          MCP_URL: ${{ steps.restaurant.outputs.mcp_url }}
          BNB_RESTAURANT_TOKEN: ${{ secrets.BNB_RESTAURANT_TOKEN }}
          READING_ID: ${{ steps.params.outputs.reading_id }}
          STATUS: ${{ steps.run.outputs.status }}
          INVOICE_ID: ${{ steps.run.outputs.invoice_id }}
          SUMMARY: ${{ steps.run.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Runs whatever happened above, so the Invoices screen never waits on a run that died:
          # a run with no outcome closes the row as failed.
          node -e '
            (async () => {
              const e = process.env;
              const status = e.STATUS === "done" ? "read" : ["read", "duplicate", "failed"].includes(e.STATUS) ? e.STATUS : "failed";
              const values = { status, summary: e.SUMMARY || (status === "failed" ? "The reading stopped before it finished." : null),
                run_url: e.RUN_URL, finished_at: new Date().toISOString() };
              if (e.INVOICE_ID) values.invoice_id = e.INVOICE_ID;
              const res = await fetch(e.MCP_URL, {
                method: "POST",
                headers: { "content-type": "application/json", accept: "application/json, text/event-stream",
                  authorization: `Bearer ${e.BNB_RESTAURANT_TOKEN}` },
                body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "tools/call",
                  params: { name: "update_row", arguments: { table: "invoice_readings", id: e.READING_ID, values } } }),
                signal: AbortSignal.timeout(30000),
              }).catch((err) => ({ ok: false, status: 0, text: async () => "" }));
              let reply = null; try { reply = JSON.parse(await res.text()); } catch (err) {}
              if (!res.ok || !reply || reply.error || !reply.result || reply.result.isError) {
                const why = reply && reply.error ? reply.error.message : reply && reply.result && reply.result.isError ? reply.result.content[0].text : `HTTP ${res.status}`;
                console.error(`::error::could not close the hand-off row (${why})`);
                process.exit(1);
              }
              console.log("hand-off closed:", status, values.invoice_id ? `· invoice ${values.invoice_id}` : "");
            })();
          '

      - name: Summary
        if: always()
        env:
          STATUS: ${{ steps.run.outputs.status }}
          SUMMARY: ${{ steps.run.outputs.summary }}
          SKILL: ${{ steps.params.outputs.skill }}
        run: |
          {
            echo "### Run a skill — \`$SKILL\` → **${STATUS:-not run}**"
            echo ""
            [ -n "$SUMMARY" ] && echo "> $SUMMARY" && echo ""
            if [ -f job/report.md ]; then cat job/report.md; elif [ -f job/result.md ]; then cat job/result.md; else echo "_No report was written._"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f job/file-url
          case "$STATUS" in
            read|duplicate|done) exit 0 ;;
            *) echo "::error::the skill ended with status '${STATUS:-not run}'"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-job-${{ steps.params.outputs.skill || 'unknown' }}
          path: |
            job/
            !job/file-url
          if-no-files-found: ignore
          retention-days: 30
